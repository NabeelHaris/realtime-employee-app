<app-header [headerText]="headerText"></app-header>
<div class="container-fluid py-4 px-3">
  <mat-card>
    <mat-card-content>
      <div class="row px-4 py-3">
        <div class="col-lg-12 col-md-12 col-sm-12">
          <form [formGroup]="employeeForm" (ngSubmit)="onSubmit()">
            <!-- Name and Role in the Same Row -->
            <!-- Employee Name -->
            <div class="row g-3 align-items-center mb-3">
              <div class="col-12">
                <mat-form-field appearance="outline" class="w-100">
                  <mat-label>Employee Name</mat-label>
                  <mat-icon matPrefix>person</mat-icon>
                  <input matInput placeholder="Enter employee name" formControlName="employeeName" />
                  <mat-error *ngIf="employeeForm.get('employeeName')?.hasError('required')">
                    Employee name is required
                  </mat-error>
                </mat-form-field>
              </div>
            </div>

            <!-- Role -->
            <div class="row g-3 align-items-center mb-3">
              <div class="col-12">
                <mat-form-field appearance="outline" class="w-100">
                  <mat-label>Select Role</mat-label>
                  <mat-icon matPrefix>work</mat-icon>
                  <mat-select formControlName="role">
                    <mat-option *ngFor="let role of roles" [value]="role">{{
                      role
                      }}</mat-option>
                  </mat-select>
                  <mat-error *ngIf="employeeForm.get('role')?.hasError('required')">
                    Role is required
                  </mat-error>
                </mat-form-field>
              </div>
            </div>

            <!-- Date Range -->
            <div class="row g-3 align-items-center">
              <!-- Start Date Input -->
              <div class="col-lg-6 col-md-6 col-sm-12">
                <mat-form-field appearance="outline" class="w-100">
                  <mat-label>Start Date</mat-label>
                  <mat-icon matPrefix>calendar_today</mat-icon>
                  <input matInput placeholder="Select Start Date" formControlName="startDate"
                    [value]="selectedDate | date: 'dd MMM yyyy'" (click)="openCalendar('start')" readonly />
                </mat-form-field>
              </div>

              <!-- End Date Input -->
              <div class="col-lg-6 col-md-6 col-sm-12">
                <mat-form-field appearance="outline" class="w-100">
                  <mat-label>End Date</mat-label>
                  <mat-icon matPrefix>calendar_today</mat-icon>
                  <input matInput placeholder="Select End Date" formControlName="endDate"
                    [value]="endDate | date: 'dd MMM yyyy'" (click)="openCalendar('end')" readonly />
                </mat-form-field>
              </div>
            </div>

            <!-- <div class="row g-3 align-items-center">
              <div class="col-lg-6 col-md-6 col-sm-12">
                <mat-form-field appearance="outline" class="w-100">
                  <mat-label>Start Date</mat-label>
                  <mat-datepicker-toggle matPrefix [for]="startDatePicker"></mat-datepicker-toggle>
                  <input matInput [matDatepicker]="startDatePicker" formControlName="startDate"
                    placeholder="Start Date" (focus)="startDatePicker.open()" />
                  <mat-datepicker #startDatePicker></mat-datepicker>
                </mat-form-field>

              <div class="col-lg-6 col-md-6 col-sm-12">

                  <mat-label>End Date</mat-label>
                  <mat-datepicker-toggle matPrefix [for]="endDatePicker"></mat-datepicker-toggle>
                  <input matInput [matDatepicker]="endDatePicker" formControlName="endDate" placeholder="End Date" (focus)="endDatePicker.open()"/>
                  <mat-datepicker #endDatePicker></mat-datepicker>
                </mat-form-field>
              </div>
            </div> -->

            <!-- Buttons -->
            <div class="row mt-4">
              <div class="col-12 d-flex justify-content-end">
                <button mat-stroked-button color="primary" class="cancel-btn me-2" type="button" (click)="onCancel()">
                  Cancel
                </button>

                <button mat-raised-button class="add-btn" color="primary" type="submit">
                  {{isEditMode ? 'Edit' : 'Save'}}
                </button>
              </div>
            </div>
          </form>
        </div>
      </div>
    </mat-card-content>
  </mat-card>
</div>
